:root{
  --bg:#FFFBF2; --panel:#FFFFFF; --ink:#26243A; --muted:#6B6880; --line:#E9DEC8;
  --c:#1B5FD1; --v:#D6246E; --f:#0A8F7F; --s1:#1B5FD1; --s2:#D6246E; --dg:#8A2BE2; --df:#C2610A; --x:#26243A;
  --accent:#5B3FD9; --accent-ink:#FFFFFF; --soft:#F1EBFF; --soft-ink:#35255F; --ok:#14794F; --warn:#B4531A;
  --font-read:'AndikaT','Andika','Century Gothic',Futura,'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  --font:'Andika','Century Gothic',Futura,'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  --fs:200px; --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overflow:hidden;font-feature-settings:"liga" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* ---------- Butang ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:46px;padding:.45em 1em;border:2px solid transparent;border-radius:14px;background:var(--soft);color:var(--soft-ink);font-weight:700;font-size:1rem;line-height:1.1;white-space:nowrap;touch-action:manipulation;transition:transform .08s ease,background .15s}
.btn:hover{background:#E6DBFF}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:#4A31BF}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:#fff}
.btn.on{background:var(--accent);color:#fff}
.btn.ok{background:#D5F3E4;color:#0B5D3A}
.btn.bad{background:#FFE0D2;color:#8A3410}
.btn.sm{min-height:36px;padding:.25em .7em;font-size:.9rem;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ic{font-size:1.15em;line-height:1}
.iconbtn{min-width:46px;padding:.45em .6em}

/* ---------- Menu utama ---------- */
.home{overflow:auto;padding:max(18px,3vmin) 16px 28px;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vmin,26px)}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.logo{font-size:clamp(2.3rem,7.5vmin,4.6rem);font-weight:700;letter-spacing:.02em;line-height:1;display:flex;gap:.04em;flex-wrap:wrap;justify-content:center}
.logo span:nth-child(5n+1){color:var(--s1)}.logo span:nth-child(5n+2){color:var(--s2)}.logo span:nth-child(5n+3){color:var(--f)}.logo span:nth-child(5n+4){color:var(--df)}.logo span:nth-child(5n){color:var(--dg)}
.tagline{color:var(--muted);font-size:clamp(1rem,2.2vmin,1.25rem)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:clamp(10px,1.8vmin,18px);width:100%;max-width:1180px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px 14px;border:0;border-radius:22px;background:var(--tc,#eee);color:var(--ink);min-height:156px;box-shadow:0 3px 0 rgba(38,36,58,.12);transition:transform .12s ease,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(38,36,58,.12)}

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   JOM BACA! - Data bahan bacaan
   Format perkataan: 'ba-ju|👕'  (tanda - = sempadan suku kata, | = gambar emoji)
   Tanda é = e taling (penanda pedagogi). Huruf e biasa = e pepet.
   Struktur data ini sama dengan format eksport JSON, jadi mudah
   disambungkan kepada Google Sheets / Apps Script pada masa hadapan
   (lihat DataSource dalam core.js).
   ===================================================================== */
const DEFAULT_MODULES = (function(){
  const used = {};
  function card(mid, gid, s, extra){
    const parts = s.split('|'); const w = parts[0], e = parts[1] || '';
    let base = mid + '.' + gid + '.' + w.replace(/-/g,''); let id = base, n = 2;
    while(used[id]){ id = base + '_' + (n++); }
    used[id] = 1;
    return Object.assign({id, w, e}, extra||{});
  }
  const list = (mid, gid, arr, extra) => arr.map(s => card(mid, gid, s, extra));
  const grp = (id, title, cards, note) => ({id, title, note: note||'', cards});

  /* ---------- MODUL 1: VOKAL ---------- */
  const vok = (w, ex) => card('vokal','v',w,{ex});
  const vokalAll = [
    vok('a',['a-yam|🐔','a-pi|🔥','a-nak|👶','a-tap']),
    vok('i',['i-kan|🐟','i-tik|🦆','i-bu|👩']),
    vok('u',['u-lar|🐍','u-bi|🍠','u-dang|🦐','un-ta|🐪']),
    vok('o',['o-tak|🧠','o-rang|🧑','om-bak|🌊','o-bor']),
    vok('e',['e-mak|👩','e-nam','em-pat','e-mas|🥇']),
    vok('é',['é-kor','é-lang|🦅','é-ja','én-jin','é-sok'])
  ];
  const vokal = {id:'vokal', no:1, title:'Huruf Vokal', sample:['a','i','u'], color:'#FFD6E2', mode:'letter', hl:{},
    desc:'a, i, u, o, e (pepet dan taling)',
    groups:[
      grp('semua','Semua vokal', vokalAll.map(c=>Object.assign({},c)), 'e pepet seperti "emak". e taling seperti "ekor". Tanda é hanya penanda; ejaan biasa guna e.'),
      grp('aiuo','a, i, u, o', vokalAll.slice(0,4).map(c=>Object.assign({},c,{id:c.id+'_b'}))),
      grp('e','Huruf e', vokalAll.slice(4).map(c=>Object.assign({},c,{id:c.id+'_c'})), 'e pepet seperti "emak". e taling seperti "ekor". Ejaan biasa kedua-duanya ialah e; é hanyalah penanda untuk bunyi taling.')
    ]};

  /* ---------- MODUL 2: KONSONAN ---------- */
  const KEX = {

/* ---------- Pecahan suku kata & grafem ---------- */
const DIGR = ['ng','ny','sy','kh','gh'];
const DIFT = ['ai','au','oi'];
const isV = ch => 'aeiouéÉ'.indexOf(ch) >= 0;
function parseW(raw){
  const parts = String(raw).split('|');
  const w = parts[0].trim().toLowerCase();
  const sy = w.split('-').filter(Boolean);
  return {w, e:(parts[1]||'').trim(), sy, text: sy.join('')};
}
function graphemes(syl){
  const out = []; let i = 0, seenV = false;
  while(i < syl.length){
    const ch = syl[i], two = syl.substr(i,2);
    if(isV(ch)){
      if(DIFT.indexOf(two) >= 0){ out.push({t:two, role:'v', sp:'df'}); i += 2; seenV = true; continue; }
      out.push({t:ch, role:'v'}); seenV = true; i++; continue;
    }
    if(DIGR.indexOf(two) >= 0){ out.push({t:two, role: seenV ? 'f':'c', sp:'dg'}); i += 2; continue; }
    out.push({t:ch, role: seenV ? 'f':'c'}); i++;
  }
  return out;
}
/* Cadangan pemecahan suku kata automatik (guru boleh membetulkan dengan tanda -) */
function autoSyllables(word){
  const w = word.toLowerCase().replace(/[^a-zé]/g,'');
  if(!w) return '';
  // token: V (vokal/diftong), C (konsonan/digraf)
  const toks = []; let i = 0;
  while(i < w.length){
    const ch = w[i], two = w.substr(i,2);
    if(isV(ch)){
      const prevC = toks.length && toks[toks.length-1].k === 'C';
      if(prevC && DIFT.indexOf(two) >= 0){ toks.push({k:'V', t:two}); i += 2; }
      else { toks.push({k:'V', t:ch}); i++; }
    } else if(DIGR.indexOf(two) >= 0){ toks.push({k:'C', t:two}); i += 2; }
    else { toks.push({k:'C', t:ch}); i++; }
  }
  const vIdx = toks.map((t,ix) => t.k === 'V' ? ix : -1).filter(x => x >= 0);
  if(vIdx.length < 2) return w;
  const cuts = [];
  for(let n = 0; n < vIdx.length - 1; n++){
    const a = vIdx[n], b = vIdx[n+1], gap = b - a - 1;
    if(gap === 0) cuts.push(b);               // V-V
    else if(gap === 1) cuts.push(a + 1);      // V-CV
    else cuts.push(a + 2);                    // VC-CV (juga VCC-CV -> VC|C..)
  }
  let res = '', last = 0;
  cuts.forEach(c => { res += toks.slice(last, c).map(t => t.t).join('') + '-'; last = c; });
  res += toks.slice(last).map(t => t.t).join('');
  return res;
}
function eTypes(card){
  if(card.u){ return /é/.test(card.w) ? ['taling'] : []; }
  const r = [];
  if(/é/.test(card.w)) r.push('taling');
  if(/e/.test(card.w)) r.push('pepet');
  return r;
}

/* ---------- Bank perkataan untuk contoh KV ---------- */
const EXTRA_BANK = ['be-sar','ce-rek','de-kat','ge-las','je-ruk','ke-cil','ke-ru-si|🪑','le-mak','me-rah','ne-nek|👵','pe-das|🌶️','re-bus','se-dap','se-mut|🐜','te-lur|🥚','te-rang',
  'wa-yar','ya-kin','fa-jar','fi-kir','za-kat','co-klat|🍫','do-a','go-reng','ho-tél|🏨','lo-ri|🚚','mo-tor|🏍️','no-ta|📝','ru-mah|🏠','ci-ta','hi-jau','ji-ran','mi-nyak','ri-ngan','wi-ra'];
function buildBank(){
  const map = {}; const add = raw => { const o = parseW(raw); if(o.sy.length >= 2 && !map[o.w]) map[o.w] = o; };
  getModules().forEach(m => m.groups.forEach(g => g.cards.forEach(c => {
    if(c.x || c.intro) return; add(c.w + (c.e ? '|'+c.e : '')); (c.ex||[]).forEach(add);
  })));
  EXTRA_BANK.forEach(add);
  return Object.values(map);
}
function examplesFor(card){
  if(card.ex && card.ex.length) return card.ex.map(parseW);
  const o = parseW(card.w); if(o.sy.length !== 1) return [];
  const key = o.w; const bank = buildBank();
  const hit = bank.filter(b => b.sy[0] === key);
  hit.sort((a,b) => (b.e?1:0) - (a.e?1:0));
  return hit.slice(0,3);
}

/* ---------- Enjin langkah (stage) ---------- */
function pcs(sy, i, o){
  return graphemes(sy[i]).map(g => {
    let c;
    if(g.sp === 'dg' && o.hl.dg) c = 'dg';
    else if(g.sp === 'df' && o.hl.df) c = 'df';
    else if(o.by === 'x') c = 'x';
    else if(o.by === 'syl') c = 's' + (i % 2 + 1);
    else c = g.role;
    return {t: o.norm ? norm(g.t) : g.t, c, s: i};
  });
}
function kindOf(item){
  const c = item.c, m = item.m, sy = parseW(c.w).sy;
  if(c.pair) return 'pair';
  if(c.intro) return 'intro';
  if(m.mode === 'letter') return 'letter';
  const txt = sy.join('');
  if(sy.length === 1 && txt.length === 1) return 'letter';
  if(m.mode === 'dtong') return 'dtong';
  if(m.mode === 'dgraf') return sy.length === 1 ? 'build' : 'dgraf';
  if(m.mode === 'kv' || m.mode === 'kvk') return sy.length === 1 ? 'build' : 'syl';
  return sy.length === 1 ? 'build' : 'syl';
}
function textOfSeg(seg){ return norm(seg.map(p => p.t).join('')); }
function stageSpeak(st){
  if(!st.segs) return [];
  if(st.join === 'none') return [textOfSeg(st.segs[0])];
  return st.segs.map(textOfSeg);
}
/* mengembalikan {stages:[...], kind} */
function getStages(item, test, hide){
  const r = getStagesRaw(item, test);
  if(hide && !test && ['syl','build','dgraf','dtong'].indexOf(r.kind) >= 0) r.stages.unshift({mask:true, join:'none', n:parseW(item.c.w).sy.length});
  return r;
}
function getStagesRaw(item, test){
  const c = item.c, m = item.m, kind = kindOf(item);
  const o = parseW(c.w), sy = o.sy;
  const black = DB.settings.color === 'black';
  const hl = m.hl || {};
  const by = d => black ? 'x' : d;
  const P = (i, d, extra) => pcs(sy, i, Object.assign({by:by(d), hl}, extra||{}));
  const allMerged = (d, extra) => [].concat.apply([], sy.map((s,i) => P(i,d,extra)));
  const stages = [];

  if(kind === 'pair'){
    return {kind, stages:[{pair:true}, {pair:true, answer:true, ex:true, final:true}]};
  }
  if(kind === 'intro'){
    const spc = m.mode === 'dtong' ? 'df' : 'dg';
    const gs = graphemes(sy[0]);
    const letters = (gs.length === 1 ? gs[0].t : sy[0]).split('');
    stages.push({segs: letters.map(ch => [{t:ch, c:spc}]), join:'plus'});
    stages.push({segs:[[{t:sy[0], c:spc}]], join:'none', ex:true, final:true, intro:true});
    return {kind, stages};
  }
  if(kind === 'letter'){
    const g = graphemes(sy[0])[0] || {role:'x'};
    const cl = black ? 'x' : g.role;
    const seg = [{t:sy[0], c:cl}];
    stages.push({segs:[seg], join:'none'});
    stages.push({segs:[seg], join:'none', ex:true, final:true});
    return {kind, stages};
  }
  if(test){
    // Mod Uji: S0 tanpa bantuan, S1 bantuan (pecah), S2 jawapan
    stages.push({segs:[allMerged('x',{norm:true, hl:{}}) ], join:'none', plain:true});
    if(sy.length > 1){
      stages.push({segs: sy.map((s,i) => P(i,'syl')), join:'dot'});
      stages.push({segs:[allMerged('syl')], join:'none', pic:true, final:true});
    } else {
      const gs = graphemes(sy[0]);
      const parts = splitBuild(gs, by, hl);
      stages.push({segs: parts, join:'dot'});
      stages.push({segs:[[].concat.apply([], parts)], join:'none', pic:true, final:true});
    }
    return {kind, stages};
  }
  if(kind === 'build'){
    const parts = splitBuild(graphemes(sy[0]), by, hl);
    if(parts.length <= 1){
      stages.push({segs:[[].concat.apply([], parts)], join:'none', final:true});
    } else {
      for(let k = 1; k <= parts.length; k++) stages.push({segs: parts.slice(0,k), join:'plus'});
      stages.push({segs:[[].concat.apply([], parts)], join:'none', final:true});
    }
    return {kind, stages};
  }
  if(kind === 'dtong'){
    const gs = [].concat.apply([], sy.map(graphemes)).filter(g => g.sp === 'df');
    if(gs.length) stages.push({segs:[[{t:gs[0].t, c: black ? 'df' : 'df'}]], join:'none'});
    stages.push({segs:[allMerged('x')], join:'none'});
    stages.push({segs: sy.map((s,i) => P(i,'syl')), join:'dot', final:true});
    return {kind, stages};
  }
  // syl & dgraf
  if(kind === 'dgraf'){
    const gs = [].concat.apply([], sy.map(graphemes)).filter(g => g.sp === 'dg');
    if(gs.length) stages.push({segs:[[{t:gs[0].t, c:'dg'}]], join:'none'});
  }
  sy.forEach((s,i) => stages.push({segs:[P(i,'syl')], join:'none'}));
  stages.push({segs: sy.map((s,i) => P(i,'syl')), join:'plus'});
  stages.push({segs:[allMerged('syl')], join:'none', final:true});
  return {kind, stages};
}
function splitBuild(gs, by, hl){
  const mk = g => {
    let c;
    if(g.sp === 'dg' && hl.dg) c = 'dg'; else if(g.sp === 'df' && hl.df) c = 'df';
    else c = by('') === 'x' ? 'x' : g.role;
    return {t:g.t, c, s:0};
  };
  const onset = [], vow = [], coda = []; let seen = false;
  gs.forEach(g => {
    if(g.role === 'v'){ vow.push(mk(g)); seen = true; }
    else if(!seen) onset.push(mk(g)); else coda.push(mk(g));
  });
  return [onset, vow, coda].filter(p => p.length);
}

/* ---------- Audio ---------- */
const Speech = {
  voices:[], warned:false,
  init(){
    if(!('speechSynthesis' in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices().filter(v => /^(ms|may)([-_]|$)/i.test(v.lang)); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  pick(){
    if(DB.settings.voice){ const v = this.voices.find(v => v.voiceURI === DB.settings.voice); if(v) return v; }
    return this.voices[0] || null;
  },
  available(){ return 'speechSynthesis' in window && this.voices.length > 0; },
  say(list, rate){
    if(!DB.settings.audio) return;
    if(!('speechSynthesis' in window)){ toast('Pelayar ini tidak menyokong audio bacaan.'); return; }
    const v = this.pick();
    if(!v){
      if(!this.warned){ toast('Tiada suara Bahasa Melayu pada peranti ini, jadi audio tidak dimainkan. Pasang suara Melayu dalam tetapan bahasa peranti.', 5200); this.warned = true; }
      return;
    }
    speechSynthesis.cancel();
    list.filter(Boolean).forEach(t => {
      const u = new SpeechSynthesisUtterance(t); u.voice = v; u.lang = v.lang; u.rate = rate || .8; speechSynthesis.speak(u);
    });
  }
};

function curModule(){ return S.modId === 'fav' ? FAV_MODULE : getModule(S.modId); }
function buildDeck(keepCard){
  const m = curModule(); if(!m) return;
  let items = groupItems(m, S.gid).filter(it => !DB.off[it.c.id]);
  if(S.favOnly) items = items.filter(it => DB.favs[it.c.id]);
  const gg = curGroupGrid();
  if(gg && DB.settings.gridOrder === 'col'){
    // jadual: baca ikut lajur (konsonan akhir yang sama berturutan)
    const fi = {}, oi = {}; gg.grid.finals.forEach((f, i) => { fi[f] = i; }); gg.grid.onsets.forEach((o, i) => { oi[o] = i; });
    const key = it => { const w = it.c.w; return (fi[w[w.length - 1]] || 0) * 100 + (oi[w[0]] || 0); };
    items = items.slice().sort((a, b) => key(a) - key(b));
  }
  if(S.shuffle) items = shuffleArr(items);
  const keepId = keepCard && S.deck[S.idx] ? S.deck[S.idx].c.id : null;
  S.deck = items;

  if(keepId){ const k = items.findIndex(it => it.c.id === keepId); if(k >= 0) S.idx = k; }

}

function go(delta){

    if(S.auto.running){ S.idx = 0; } else { toast('Kad terakhir. Tekan Ulang atau pilih kumpulan lain.'); return; }

/* Bunyi fonik Bahasa Melayu: konsonan dibunyikan dengan e pepet (b = "bə"), bukan nama huruf ("bi").
   Ejaan 'e' dalam teks sebutan dibaca sebagai pepet oleh suara Melayu. Vokal dan suku kata dibaca seperti ejaan. */
const FONIK = {
  b:'be', c:'ce', d:'de', f:'fe', g:'ge', h:'he', j:'je', k:'ke', l:'le', m:'me', n:'ne', p:'pe', q:'ke', r:'re',
  s:'se', t:'te', v:'ve', w:'we', x:'kese', y:'ye', z:'ze',
  ng:'nge', ny:'nye', sy:'sye', kh:'khe', gh:'ghe'
};
function fonikText(t){
  if(DB.settings.letterSound !== 'fonik') return t;
  const k = String(t).toLowerCase();
  return Object.prototype.hasOwnProperty.call(FONIK, k) ? FONIK[k] : t;
}
function speakStage(){
  const it = item(); if(!it) return;
  const sg = stagesNow().stages; let st = sg[S.step];
  // rakaman suara guru: digunakan jika semua bunyi dalam sebutan ini sudah direkod
  if(DB.settings.audio && Clips.enabled()){
    let items = null;
    const mp = p => ({t:p.t, s:p.s});
    if(it.c.pair) items = [[{t:it.c.pair[S.pairTarget]}]];
    else if(st.segs && !st.mask) items = st.join === 'none' ? [st.segs[0].map(mp)] : st.segs.map(seg => seg.map(mp));
    if(items){
      const slots = items.map(clipSlotsFor);
      if(slots.every(Boolean)){ Clips.play(slots).then(ok => { if(!ok) speakTts(it, st); }); return; }
    }
  }
  speakTts(it, st);
}
function speakTts(it, st){
  let list = st.mask ? [] : stageSpeak(st);
  if(!list.length){ list = [norm(parseW(it.c.w).text)]; }
  if(it.c.pair){ list = [it.c.pair[S.pairTarget]]; }
  list = list.map(fonikText);
  Speech.say(list, list.length > 1 ? .6 : .75);
}

function fitWord(){
  const word = $('#word'), box = $('#cardbox'); if(!word || !box) return;
  const top = $('.top', box), bot = $('.bot', box), exs = $('#exs');
  const th = top ? top.offsetHeight : 0, bh = bot ? bot.offsetHeight : 0;
  let availH;
  if(exs && exs.children.length){
    // ada contoh / gambar: huruf di tengah ruang yang tinggal
    word.style.top = th + 'px'; word.style.bottom = bh + 'px';
    availH = Math.max(60, box.clientHeight - th - bh - 8);
  } else {
    // huruf bersendirian: tepat di tengah kad
    word.style.top = '0'; word.style.bottom = '0';
    availH = Math.max(60, box.clientHeight - 2 * Math.max(th, bh) - 8);
  }
  const availW = box.clientWidth - 40;
  let fs = Math.min(availH / 1.22, availW * 0.62) * (SIZES[DB.settings.size] / .42);
  if(word.dataset.k === 'pair') fs *= .72;
  fs = Math.max(36, Math.min(fs, availH / 1.2));
  word.style.fontSize = fs + 'px';
  const ch = word.firstElementChild;
  if(ch){
    for(let k = 0; k < 3; k++){
      const w = ch.scrollWidth;
      if(w > availW){ fs = fs * availW / w * .98; word.style.fontSize = fs + 'px'; } else break;
    }
  }
  centerInk();
}
/* Letakkan dakwat huruf (bukan kotak garisan) tepat di tengah kawasan perkataan */
function centerInk(){
  const word = $('#word'); const ch = word && word.firstElementChild; if(!ch) return;
  ch.style.top = '0px';
  const items = ch.querySelectorAll('.p, .pl'); if(!items.length) return;
  const letters = Array.from(items).map(e => e.firstChild && e.firstChild.nodeType === 3 ? e.firstChild.textContent : e.textContent).join('');
  const fs = parseFloat(word.style.fontSize); if(!fs || !letters) return;
  const cv = centerInk.cv || (centerInk.cv = document.createElement('canvas').getContext('2d'));
  const cs = getComputedStyle(items[0]);
  cv.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
  const m = cv.measureText(letters);
  if(!m.actualBoundingBoxAscent && !m.actualBoundingBoxDescent) return;
  const probe = document.createElement('span'); probe.style.cssText = 'display:inline-block;width:0;height:0';
  items[0].appendChild(probe);
  // kedudukan garis dasar mengikut tata letak (tidak terjejas oleh animasi / transform)
  let base = 0, el = probe;
  while(el && el !== word){ base += el.offsetTop; el = el.offsetParent; }
  probe.remove();
  const inkCenter = base + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
  ch.style.top = (word.clientHeight / 2 - inkCenter) + 'px';
}

'use strict';
/* =====================================================================
   JOM BACA! - Rekod bunyi guru (vokal, konsonan, digraf, diftong)
   - Rakaman disimpan dalam IndexedDB pada peranti (format WAV mono 22 kHz).
   - Senyap di awal dan hujung dipangkas supaya klip boleh digabung tanpa jeda.
   - Slot:  v:<vokal|diftong>   h:<konsonan|digraf> (bunyi huruf, cth. "bə")
                                g:<konsonan|digraf> (bunyi gabung, cth. "b" pendek)
   - Jika semua bunyi dalam satu sebutan ada rakaman, rakaman dimainkan
     berturut-turut. Jika tidak, suara TTS peranti digunakan.
   ===================================================================== */
const CONS = 'bcdfghjklmnpqrstvwxyz'.split('');
const DIGRAPHS = ['ng','ny','sy','kh','gh'];
const REC_RATE = 22050;

/* ---------- WAV / base64 ---------- */
function encodeWav(f32, sr){
  const n = f32.length, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const ws = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36,'data'); v.setUint32(40, n * 2, true);
  for(let i = 0; i < n; i++){ const x = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return ab;
}
function abToB64(ab){
  const b = new Uint8Array(ab); let s = ''; const CH = 0x8000;
  for(let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
  return btoa(s);
}
function b64ToAb(str){
  const s = atob(str), b = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b.buffer;
}

/* ---------- Gedung klip + main ---------- */
const Clips = {
  keys:new Set(), bufs:new Map(), mem:new Map(), dbp:null, ctx:null, srcs:[],
  _db(){
    if(this.dbp) return this.dbp;
    this.dbp = new Promise(res => {
      try {
        const r = indexedDB.open('jombaca-audio', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('clips');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch(e){ res(null); }
    });
    return this.dbp;
  },
  async _tx(mode, fn){
    const db = await this._db(); if(!db) return null;
    return new Promise(res => {
      try {
        const tx = db.transaction('clips', mode); const rq = fn(tx.objectStore('clips'));
        tx.oncomplete = () => res(rq && rq.result !== undefined ? rq.result : true);
        tx.onerror = () => res(null); tx.onabort = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async init(){
    const keys = await this._tx('readonly', st => st.getAllKeys());
    if(Array.isArray(keys)) keys.forEach(k => this.keys.add(k));
  },
  enabled(){ return DB.settings.useClips !== false && this.keys.size > 0; },
  has(slot){ return this.keys.has(slot); },
  ac(){
    if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; this.ctx = new C(); }
    return this.ctx;
  },
  async put(slot, ab){
    this.bufs.delete(slot);
    const ok = await this._tx('readwrite', st => st.put(ab, slot));
    if(!ok) this.mem.set(slot, ab);
    this.keys.add(slot);
  },
  async getAb(slot){
    if(this.mem.has(slot)) return this.mem.get(slot);
    const r = await this._tx('readonly', st => st.get(slot));
    return r && r !== true ? r : null;
  },
  async del(slot){
    this.bufs.delete(slot); this.mem.delete(slot); this.keys.delete(slot);
    await this._tx('readwrite', st => st.delete(slot));
  },
  async buffer(slot){
    if(this.bufs.has(slot)) return this.bufs.get(slot);
    const ab = await this.getAb(slot); const ctx = this.ac(); if(!ab || !ctx) return null;
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab.slice(0), res, rej); if(p && p.catch) p.catch(rej); }).catch(() => null);
    if(buf) this.bufs.set(slot, buf);

  },
  stop(){ this.srcs.forEach(s => { try { s.stop(); } catch(e){} }); this.srcs = []; },
  /* items = [[slot, slot...], ...]: slot dalam satu item disambung dengan pertindihan pendek dan pudar silang
     supaya konsonan mengalir ke vokal (b + a = ba); antara item ada jeda pendek */
  async play(items){
    this.stop();
    const ctx = this.ac(); if(!ctx) return false;
    try { if(ctx.state === 'suspended') await ctx.resume(); } catch(e){}
    const lists = [];
    for(const it of items){
      const bs = [];
      for(const raw of it){
        const partial = raw.slice(-1) === '~', slot = partial ? raw.slice(0, -1) : raw;
        const b = await this.buffer(slot); if(!b) return false;
        bs.push({buf:b, slot, dur: partial ? Math.min(b.duration, 0.11) : b.duration, partial});
      }
      lists.push(bs);
    }
    const kind = s => s[0] === 'v' ? 'v' : (s[0] === 'g' || s[0] === 'h') ? 'c' : 's';
    const overlap = (a, b) => {
      const ka = kind(a.slot), kb = kind(b.slot); let o = 0;
      if(ka === 'c' && kb === 'v') o = 0.06; else if(ka === 'v' && kb === 'c') o = 0.025; else if(ka === 'v' && kb === 'v') o = 0.012;
      return Math.min(o, a.dur * 0.6, b.dur * 0.6);
    };
    let t = ctx.currentTime + 0.05;
    lists.forEach((bs, i) => {
      if(i > 0) t += 0.35;
      const ovIn = bs.map((c, j) => j > 0 ? overlap(bs[j - 1], c) : 0);
      let start = t;
      bs.forEach((c, j) => {
        if(j > 0) start = start - ovIn[j] ;
        const ovOut = j < bs.length - 1 ? ovIn[j + 1] : 0, end = start + c.dur;
        const src = ctx.createBufferSource(); src.buffer = c.buf;
        const g = ctx.createGain();
        const fadeOut = c.partial ? Math.max(ovOut, 0.03) : ovOut;
        g.gain.setValueAtTime(ovIn[j] > 0 ? 0 : 1, start);
        if(ovIn[j] > 0) g.gain.linearRampToValueAtTime(1, start + ovIn[j]);
        if(fadeOut > 0){ g.gain.setValueAtTime(1, Math.max(start + ovIn[j], end - fadeOut)); g.gain.linearRampToValueAtTime(0, end); }
        src.connect(g); g.connect(ctx.destination);
        if(c.partial) src.start(start, 0, c.dur); else src.start(start);
        this.srcs.push(src);
        start = end;
      });
      t = start;
    });
    return true;
  },
  async exportAll(){
    const out = {};
    for(const k of Array.from(this.keys)){ const ab = await this.getAb(k); if(ab) out[k] = abToB64(ab); }
    return out;
  },
  async importAll(obj){

  }
};

/* Padankan bahagian sebutan kepada slot rakaman. pieces = [{t, s}] (s = nombor suku kata).
   Keutamaan: rakaman suku kata penuh (s:ba) -> rakaman huruf (g:/h:/v:). null = ada yang belum direkod.
   Hujung "~" = hanya bahagian awal klip (untuk membuang "ə" pada bunyi huruf yang digunakan sebagai bunyi gabung). */
function clipSlotsFor(pieces){
  const multi = pieces.length > 1, out = [];
  let i = 0;
  while(i < pieces.length){
    const p0 = pieces[i], first = typeof p0 === 'string' ? {t:p0} : p0;
    // 1) suku kata penuh
    if(first.s !== undefined && multi){
      let j = i, syl = '';
      while(j < pieces.length && pieces[j].s === first.s){ syl += String(pieces[j].t).toLowerCase(); j++; }
      if(j - i > 1 && Clips.has('s:' + syl)){ out.push('s:' + syl); i = j; continue; }
    }
    // 2) huruf demi huruf
    const t = String(first.t).toLowerCase(); let cands;
    if(t === 'ai' || t === 'au' || t === 'oi'){
      if(Clips.has('v:' + t)){ out.push('v:' + t); i++; continue; }
      if(Clips.has('v:' + t[0]) && Clips.has('v:' + t[1])){ out.push('v:' + t[0], 'v:' + t[1]); i++; continue; }
      return null;
    }
    else if(t.length === 1 && isV(t)) cands = ['v:' + t];
    else if(CONS.indexOf(t) >= 0 || DIGRAPHS.indexOf(t) >= 0) cands = multi ? ['g:' + t, 'h:' + t + '~'] : ['h:' + t, 'g:' + t];
    else return null;
    const s = cands.find(c => Clips.has(c.replace('~', ''))); if(!s) return null;
    out.push(s); i++;
  }
  return out;
}

async function toTrimmedWav(blob){
  const ctx = Clips.ac(); if(!ctx) throw new Error('audio');
  const ab = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if(p && p.catch) p.catch(rej); });
  const n = buf.length, sr = buf.sampleRate, chs = buf.numberOfChannels, mono = new Float32Array(n);
  for(let c = 0; c < chs; c++){ const d = buf.getChannelData(c); for(let i = 0; i < n; i++) mono[i] += d[i] / chs; }
  let peak = 0; for(let i = 0; i < n; i++){ const a = Math.abs(mono[i]); if(a > peak) peak = a; }
  if(peak < 0.012) throw new Error('senyap');
  // ambang berdasarkan hingar latar (30 ms pertama) supaya letupan konsonan yang perlahan tidak terpangkas
  let nf = 0; const nfN = Math.min(n, Math.round(0.03 * sr));
  for(let i = 0; i < nfN; i++){ const a = Math.abs(mono[i]); if(a > nf) nf = a; }
  const thr = Math.min(peak * 0.12, Math.max(0.005, nf * 2.5, peak * 0.02));
  let s = 0, e = n - 1;
  while(s < n && Math.abs(mono[s]) < thr) s++;
  while(e > s && Math.abs(mono[e]) < thr) e--;
  s = Math.max(0, s - Math.round(0.010 * sr)); e = Math.min(n - 1, e + Math.round(0.020 * sr));
  const len = e - s + 1; if(len < sr * 0.04) throw new Error('senyap');
  const gain = 0.9 / peak, fade = Math.round(0.006 * sr);
  const seg = new Float32Array(len);
  for(let i = 0; i < len; i++){
    let g = gain; if(i < fade) g *= i / fade; else if(len - 1 - i < fade) g *= (len - 1 - i) / fade;
    seg[i] = mono[s + i] * g;
  }
  const ratio = sr / REC_RATE, outN = Math.max(1, Math.floor(len / ratio)), out = new Float32Array(outN);
  for(let i = 0; i < outN; i++){ const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(len - 1, i0 + 1), f = p - i0; out[i] = seg[i0] * (1 - f) + seg[i1] * f; }
  return encodeWav(out, REC_RATE);
}

const Rek = {stream:null, rec:null, slot:null, chunks:[], vad:null, hard:null, chain:null, ov:null, src:null};
async function rekStream(){
  if(Rek.stream && Rek.stream.active) return Rek.stream;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    toast('Pelayar ini tidak menyokong rakaman suara. Cuba Chrome, Edge atau Safari terkini.', 5000); return null;
  }
  try {
    Rek.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:true}});
    return Rek.stream;
  } catch(e){
    toast(e && e.name === 'NotFoundError'
      ? 'Mikrofon tidak ditemui pada peranti ini.'
      : 'Mikrofon tidak dibenarkan atau tidak tersedia di sini. Buka aplikasi melalui laman web biasa (https) dan benarkan mikrofon. Pautan artifak Claude menyekat mikrofon.', 7000);
    return null;
  }
}
function rekCleanup(){
  clearInterval(Rek.vad); clearTimeout(Rek.hard); Rek.vad = null; Rek.hard = null;
  if(Rek.src){ try { Rek.src.disconnect(); } catch(e){} Rek.src = null; }
}
async function rekStart(slot){
  if(Rek.rec) return;
  const stream = await rekStream(); if(!stream) return;
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){} Clips.stop();
  const ctx = Clips.ac(); try { if(ctx && ctx.state === 'suspended') await ctx.resume(); } catch(e){}
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  Rek.chunks = []; Rek.slot = slot; Rek.rec = rec;
  rec.ondataavailable = e => { if(e.data && e.data.size) Rek.chunks.push(e.data); };
  rec.onstop = async () => {
    rekCleanup();
    const done = Rek.slot, blob = new Blob(Rek.chunks, {type: rec.mimeType || mime || 'audio/webm'});
    Rek.rec = null; Rek.slot = null;
    let ok = false;
    try { const wav = await toTrimmedWav(blob); await Clips.put(done, wav); ok = true; toast('Direkod.', 1100); }
    catch(err){ toast(err && err.message === 'senyap' ? 'Bunyi tidak dikesan. Cuba lagi, dekatkan mikrofon.' : 'Rakaman gagal. Cuba lagi.', 3200); Rek.chain = null; }
    rkRefresh();
    if(ok && Rek.chain) setTimeout(rekChainNext, 750);
  };
  rec.start();
  // berhenti sendiri apabila guru diam selepas bercakap
  if(ctx){
    try {
      Rek.src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 1024; Rek.src.connect(an);
      const data = new Float32Array(an.fftSize); let spoke = false, quiet = null; const t0 = performance.now();
      Rek.vad = setInterval(() => {
        an.getFloatTimeDomainData(data); let sum = 0; for(let i = 0; i < data.length; i++) sum += data[i] * data[i];
        const rms = Math.sqrt(sum / data.length), now = performance.now();
        if(rms > 0.02){ spoke = true; quiet = null; }
        else if(spoke){ if(quiet === null) quiet = now; else if(now - quiet > 650) rekStop(false); }
        if(!spoke && now - t0 > 6000) rekStop(false);
      }, 50);
    } catch(e){}
  }
  Rek.hard = setTimeout(() => rekStop(false), 3500);
  rkRefresh();
}
function rekStop(manual){
  if(manual) Rek.chain = null;
  if(Rek.rec && Rek.rec.state !== 'inactive') Rek.rec.stop();
}
function rekChainNext(){
  if(!Rek.chain || !Rek.chain.length){ Rek.chain = null; toast('Selesai merekod bahagian ini.'); rkRefresh(); return; }
  const slot = Rek.chain.shift();
  const tile = Rek.ov && Rek.ov.querySelector('[data-slot="' + slot + '"]');
  if(tile && tile.scrollIntoView) tile.scrollIntoView({block:'center', behavior:'smooth'});
  rekStart(slot);
}

      if(last && last.w === w && now - last.t < 450){ last = null; goTo(w); } else last = {w, t:now};
      return;
    }
    goTo(w);
  });
}

'use strict';
/* =====================================================================
   JOM BACA! - Sambungan pangkalan data pusat (Google Sheets + Apps Script)
   Jika CLOUD_URL kosong, aplikasi bekerja seperti biasa (data pada peranti sahaja).
   Jika diisi:
     - semua peranti MEMBACA tetapan kongsi + bahan yang disunting daripada pangkalan data;
     - hanya admin (PIN disahkan oleh pelayan) boleh MENULIS;
     - PIN tidak lagi disimpan pada peranti.
   ===================================================================== */
const CLOUD_URL = '';   // alamat Web app Apps Script (berakhir /exec). Kosong = tidak digunakan.
const SYNC_KEYS = ['caseMode','size','color','mark','letterSound','ptrStyle','ptrSize','audio'];   // tetapan yang dikongsi
const Cloud = {
  state:{loaded:false, ok:false, hasPin:false, version:0},
  token:null, tokenUntil:0, timer:null, last:null, busy:false, warned:false,
  enabled(){ return !!CLOUD_URL; },
  authed(){ return !!this.token && Date.now() < this.tokenUntil; },
  setToken(t, ttl){ this.token = t; this.tokenUntil = Date.now() + ((ttl || 1800) - 60) * 1000; },
  clearToken(){ this.token = null; this.tokenUntil = 0; },

  /* ---------- rangkaian ---------- */
  async fetchJson(url, opt, ms){
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = setTimeout(() => { if(ctl) ctl.abort(); }, ms || 12000);
    try {
      const r = await fetch(url, Object.assign({signal: ctl && ctl.signal}, opt || {}));
      if(!r.ok) throw new Error('http ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  },
  /* POST sebagai text/plain supaya tiada pra-penerbangan CORS (diperlukan oleh Apps Script) */
  async call(payload){
    try {
      return await this.fetchJson(CLOUD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
    } catch(e){ return {ok:false, error:'network'}; }
  },

  /* ---------- baca ---------- */
  pickSettings(){ const o = {}; SYNC_KEYS.forEach(k => { o[k] = DB.settings[k]; }); return o; },
  payload(){ return {settings:this.pickSettings(), overrides:DB.overrides, dropped:DB.dropped}; },
  apply(d){
    SYNC_KEYS.forEach(k => { if(d.settings && d.settings[k] !== undefined) DB.settings[k] = d.settings[k]; });
    DB.overrides = d.overrides || {}; DB.dropped = d.dropped || {};
  },
  async load(){
    if(!this.enabled()) return;
    let r;
    try { r = await this.fetchJson(CLOUD_URL + (CLOUD_URL.indexOf('?') < 0 ? '?' : '&') + 'action=get&t=' + Date.now()); }
    catch(e){ r = null; }
    if(!r || !r.ok){
      this.state.ok = false;
      if(!this.warned){ this.warned = true; toast('Tidak dapat menyambung ke pangkalan data. Menggunakan data terakhir pada peranti ini.', 4500); }
      return;
    }
    const pending = DB.cloudMeta && DB.cloudMeta.pending;
    this.state.ok = true; this.state.loaded = true; this.state.hasPin = !!r.hasPin; this.state.version = r.version || 0;
    let changed = false;
    if(!pending && r.version > 0){
      const before = JSON.stringify([this.pickSettings(), DB.overrides, DB.dropped]);
      this.apply(r);
      changed = before !== JSON.stringify([this.pickSettings(), DB.overrides, DB.dropped]);
    }
    DB.cloudMeta = {version:r.version || 0, hasPin:!!r.hasPin, pending:!!pending};
    // pangkalan data kosong (versi 0): kekalkan data peranti ini dan muat naik apabila admin menyimpan
    this.last = r.version > 0 ? JSON.stringify(this.payload()) : null;
    DataSource.save(DB); admSync();
    if(pending) toast('Ada perubahan pada peranti ini yang belum disimpan ke pangkalan data. Buka Tetapan sebagai admin untuk menyimpannya.', 6000);
    if(S.view === 'home') renderHome(); else if(changed && !$('.ovl')) { /* kemas kini sebenar pada navigasi seterusnya */ }
  },

  /* ---------- tulis (hanya admin) ---------- */
  schedule(){
    if(!this.enabled() || !this.authed()) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500);
  },
  async push(){
    if(!this.enabled() || this.busy) return;
    const body = this.payload(), str = JSON.stringify(body);
    if(str === this.last) return;
    if(!this.authed()){ this.markPending(true); return; }
    this.busy = true;
    const r = await this.call(Object.assign({action:'save', token:this.token, baseVersion:this.state.version}, body));
    this.busy = false;
    if(r.ok){
      this.state.version = r.version; this.last = str;
      DB.cloudMeta = {version:r.version, hasPin:true, pending:false}; DataSource.save(DB);
      toast('Disimpan ke pangkalan data.', 1400);
    } else if(r.error === 'auth'){
      this.clearToken(); Admin.lock(); this.markPending(true);
      toast('Sesi admin tamat. Masukkan PIN admin semula untuk menyimpan.', 4500);
    } else if(r.error === 'conflict'){
      DB.cloudMeta = {version:r.version, hasPin:true, pending:false};
      toast('Admin lain telah menyimpan perubahan. Data terkini dimuatkan.', 4500);
      await this.load();
      if(S.view === 'player') openModule(S.modId, S.gid);
    } else {
      this.markPending(true);
      toast('Tidak dapat menyimpan ke pangkalan data. Perubahan kekal pada peranti ini. Cuba lagi apabila ada sambungan.', 5000);
    }
  },
  markMeta(){ DB.cloudMeta = {version:this.state.version, hasPin:this.state.hasPin, pending:!!(DB.cloudMeta && DB.cloudMeta.pending)}; DataSource.save(DB); },
  markPending(v){ DB.cloudMeta = Object.assign({}, DB.cloudMeta || {version:this.state.version, hasPin:this.state.hasPin}, {pending:v}); DataSource.save(DB); }
};

/* Data tersimpan terakhir digunakan serta-merta (juga semasa luar talian) */

'use strict';
/* =====================================================================
   JOM BACA! - Kunci admin (PIN)
   Mengunci: Tetapan, Edit Bahan, Import / Eksport. (Rekod Bunyi tidak dikunci.)
   PIN disimpan sebagai cincang SHA-256 bergaram dalam localStorage peranti ini.
   Jika ADMIN_BAKED diisi, PIN yang sama digunakan pada semua peranti.
   NOTA: ini kunci pada pelayar, bukan keselamatan pelayan. Ia menghalang
   murid dan rakan sekerja daripada mengubah sesuatu secara tidak sengaja,
   tetapi tidak dapat menghalang orang yang sengaja memadam data laman.
   ===================================================================== */
const ADMIN_BAKED = {h:'', s:''};   // contoh: {h:'<sha256 hex>', s:'<garam>'}; kosong = tidak digunakan
const ADMIN_MINUTES = 10;           // tempoh admin kekal terbuka
const Admin = {
  until:0, fails:0, blockedUntil:0,
  rec(){ return DB.admin || (ADMIN_BAKED.h ? ADMIN_BAKED : null); },
  // dengan pangkalan data: PIN disahkan oleh pelayan. Jika status PIN belum diketahui, anggap ada PIN (tutup)
  hasPin(){ if(Cloud.enabled()) return Cloud.state.loaded ? Cloud.state.hasPin : true; return !!this.rec(); },
  locked(){ return this.hasPin() && (Date.now() >= this.until || (Cloud.enabled() && !Cloud.authed())); },
  unlocked(){ return !this.locked(); },
  touch(){ this.until = Date.now() + ADMIN_MINUTES * 60 * 1000; admSync(); },
  lock(){ this.until = 0; if(Cloud.enabled()) Cloud.clearToken(); admSync(); }
};
function admSync(){ document.body.classList.toggle('admlocked', Admin.locked()); }

/* ---------- Cincang ---------- */
function cyrb(str, seed){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
async function hashPin(pin, salt){
  const s = salt + ':' + pin;
  try {
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch(e){}
  return 'c' + cyrb(s, 1) + cyrb(s, 2) + cyrb(s, 3) + cyrb(s, 4);   // cadangan jika crypto.subtle tiada
}
function newSalt(){
  const a = new Uint8Array(12);
  try { crypto.getRandomValues(a); } catch(e){ for(let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- Dialog PIN ---------- */
function requireAdmin(next){
  if(Admin.unlocked()){ if(Admin.hasPin()) Admin.touch(); next(); return; }
  askPin(next);
}
function askPin(next){
  const ov = overlay('<div class="modal" role="dialog" aria-label="Kunci admin" style="width:min(100%,420px)"><div class="mh"><h2>🔒 Admin sahaja</h2></div>' +
    '<div class="mb"><div>Tetapan, Edit Bahan dan Import / Eksport hanya boleh dibuka oleh admin. Masukkan PIN admin.</div>' +
    '<input type="password" id="pinIn" inputmode="numeric" autocomplete="off" aria-label="PIN admin" placeholder="PIN admin">' +
    '<div id="pinErr" class="prev" style="color:#B4531A;font-weight:700;min-height:1.3em" role="alert"></div></div>' +
    '<div class="mf"><button class="btn" data-pin="no">Batal</button><button class="btn pri" data-pin="ok">Buka</button></div></div>', 'pinOvl');
  const inp = $('#pinIn', ov), err = $('#pinErr', ov); inp.focus();
  const submit = async () => {
    const wait = Admin.blockedUntil - Date.now();
    if(wait > 0){ err.textContent = 'Terlalu banyak cubaan. Cuba lagi dalam ' + Math.ceil(wait / 1000) + ' saat.'; return; }
    const pin = inp.value; if(!pin){ err.textContent = 'Masukkan PIN.'; return; }
    if(Cloud.enabled()){ await cloudVerify(pin, ov, inp, err, next); return; }
    const r = Admin.rec(); const h = await hashPin(pin, r.s);
    if(h === r.h){
      Admin.fails = 0; Admin.touch(); ov.remove(); toast('Admin dibuka selama ' + ADMIN_MINUTES + ' minit.', 1800); next();
    } else {
      Admin.fails++; inp.value = ''; inp.focus();
      if(Admin.fails >= 5){ Admin.fails = 0; Admin.blockedUntil = Date.now() + 30000; err.textContent = 'PIN salah 5 kali. Cuba lagi dalam 30 saat.'; }
      else err.textContent = 'PIN salah (' + Admin.fails + ' / 5).';
    }
  };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-pin]');
    if(b){ if(b.dataset.pin === 'ok') submit(); else ov.remove(); }
    else if(e.target === ov) ov.remove();
  });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
}
/* Pengesahan PIN oleh pelayan (pangkalan data) */
async function cloudVerify(pin, ov, inp, err, next){
  const r = await Cloud.call({action:'verify', pin});
  if(r.ok){
    Cloud.setToken(r.token, r.ttl); Admin.touch(); ov.remove(); toast('Admin dibuka selama ' + ADMIN_MINUTES + ' minit.', 1800);
    if(DB.cloudMeta && DB.cloudMeta.pending) Cloud.push();
    next(); return;
  }
  inp.value = ''; inp.focus();
  if(r.error === 'blocked') err.textContent = 'Terlalu banyak cubaan. Cuba lagi dalam ' + (r.retry || 60) + ' saat.';
  else if(r.error === 'wrong_pin') err.textContent = 'PIN salah (' + (5 - (r.left || 0)) + ' / 5).';
  else if(r.error === 'no_pin'){ Cloud.state.hasPin = false; Cloud.markMeta(); admSync(); ov.remove(); next(); }
  else err.textContent = 'Tiada sambungan ke pangkalan data. Admin memerlukan sambungan internet.';
}

      $$('[data-set="'+k+'"]', ov).forEach(x => x.classList.toggle('on', x === b));
      if(k === 'audio' && v === false) try { speechSynthesis.cancel(); } catch(x){}
      if(k === 'ptrStyle' || k === 'ptrSize') ptrApply();
      if(S.view === 'player') renderPlayer(); else renderHome();
    } else if(e.target.closest('[data-close]') || e.target === ov){ ov.remove(); }
  });
  const vsel = $('#voiceSel', ov); if(vsel) vsel.addEventListener('change', () => { DB.settings.voice = vsel.value; persist(); });
}

const ED = {mod:null, grp:null, bulk:false};
function sanitizeWord(v, mode){
  let w = String(v).toLowerCase().replace(/[^a-zé\- ]/g,'').replace(/\s+/g,' ').trim();
  if(mode !== 'letter' && mode !== 'pair') w = w.replace(/ /g,'');
  return w;
}
function finalizeWord(w, m){
  if(!w) return '';
  if(m.mode === 'letter' || w.indexOf('-') >= 0 || w.indexOf(' ') >= 0) return w;
  if(m.mode === 'kv' || m.mode === 'kvk') return w;
  return autoSyllables(w);
}
function extractEmoji(line){
  const re = /[\u{1F300}-\u{1FAFF}☀-➿⭐⬆️‍]+/gu; const m = line.match(re);
  return {word: line.replace(re,'').replace(/[\t,;]+/g,' ').trim(), emoji: m ? m.join('') : ''};
}

  const ov = overlay('<div class="modal wide" role="dialog" aria-label="Edit bahan" id="edModal"></div>', 'edOvl');
  drawEditor(ov);
  ov.addEventListener('click', e => edClick(e, ov));

  });

function fillCpGrp(ov){

}
function newId(){ return 'u.' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function edGroup(){ const m = editableModule(ED.mod); return {m, g: m.groups.find(x => x.id === ED.grp) || m.groups[0]}; }
function edAdd(ov){
  const {m, g} = edGroup();
  const wRaw = sanitizeWord($('#newW', ov).value, m.mode); const e = $('#newE', ov).value.trim();
  if(!wRaw){ toast('Taip perkataan dahulu.'); return; }

  persist(); drawEditor(ov); $('#newW', ov).focus(); toast('Kad ditambah.');
}
function edClick(e, ov){
  const b = e.target.closest('[data-ed]'); if(!b){ return; }
  const a = b.dataset.ed, i = +b.dataset.i;

    lines.forEach(l => { const x = extractEmoji(l); const w = sanitizeWord(x.word, m.mode); if(w){ g.cards.push({id:newId(), w:finalizeWord(w, m), e:x.emoji, u:true}); n++; } });

    const ovn = overlay('<div class="modal" style="width:min(100%,420px)"><div class="mh"><h2>Kumpulan baharu</h2></div><div class="mb"><input type="text" id="gName" placeholder="Nama kumpulan" aria-label="Nama kumpulan"></div><div class="mf"><button class="btn" data-n="no">Batal</button><button class="btn pri" data-n="ok">Simpan</button></div></div>');
    const inp = $('#gName', ovn); inp.focus();

    ovn.addEventListener('click', ev => { const t = ev.target.closest('[data-n]'); if(t){ if(t.dataset.n === 'ok') ok(); else ovn.remove(); } else if(ev.target === ovn) ovn.remove(); });
    inp.addEventListener('keydown', ev => { if(ev.key === 'Enter') ok(); });
    return;
  }
  if(a === 'rengrp'){
    const {g} = edGroup();
    const ovn = overlay('<div class="modal" style="width:min(100%,420px)"><div class="mh"><h2>Namakan semula</h2></div><div class="mb"><input type="text" id="gName" value="'+esc(g.title)+'" aria-label="Nama kumpulan"></div><div class="mf"><button class="btn" data-n="no">Batal</button><button class="btn pri" data-n="ok">Simpan</button></div></div>');
    const inp = $('#gName', ovn); inp.focus(); inp.select();

    if(m.groups.length <= 1){ toast('Modul mesti mempunyai sekurang-kurangnya satu kumpulan.'); return; }
    confirmBox('Padam kumpulan "' + g.title + '" dan semua kadnya?', 'Padam', () => { DB.dropped[m.id + '.' + g.id] = 1; m.groups = m.groups.filter(x => x !== g); ED.grp = m.groups[0].id; persist(); drawEditor(ov); });
    return;

    return;
  }

    const {g} = edGroup(); let src = [];
    if(a === 'copy'){ const sm = getModule($('#cpMod', ov).value); const sg = sm.groups.find(x => x.id === $('#cpGrp', ov).value); src = sg ? sg.cards.filter(c => !c.intro && !c.pair) : []; }
    else src = favItems().map(x => x.c).filter(c => !c.pair && !c.intro);
    src.forEach(c => g.cards.push({id:newId(), w:c.w, e:c.e||'', u:!/é|e/.test(c.w) ? true : false}));

  }
  if(isNaN(i)) return;

  if(a === 'del'){ g.cards.splice(i,1); persist(); drawEditor(ov); return; }
  if(a === 'up' && i > 0){ [g.cards[i-1], g.cards[i]] = [g.cards[i], g.cards[i-1]]; persist(); drawEditor(ov); return; }
  if(a === 'down' && i < g.cards.length - 1){ [g.cards[i+1], g.cards[i]] = [g.cards[i], g.cards[i+1]]; persist(); drawEditor(ov); return; }

}
function edChange(e, ov){

  if(a === 'on'){ if(t.checked) delete DB.off[c.id]; else DB.off[c.id] = true; persist(); t.closest('.erow').classList.toggle('off', !t.checked); }

/* ---------- Acara global ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  switch(a){
    case 'open': openModule(b.dataset.v); break;
    case 'resume': openModule(DB.last.mod, DB.last.grp); break;
    case 'home': stopAuto(); if(S.teach) exitTeach(); renderHome(); break;
    case 'grp': setGroup(b.dataset.v); break;
    case 'mode': setMode(b.dataset.v); break;
    case 'prev': go(-1); break;
    case 'next': if(S.mode === 'uji' || S.mode === 'auto' || true) go(1); break;
    case 'repeat': S.step = 0; S.ex = false; S.pic = false; refresh(); break;
    case 'shuffle': S.shuffle = !S.shuffle; buildDeck(false); refresh(); toast(S.shuffle ? 'Susunan rawak dihidupkan.' : 'Susunan asal dipulihkan.'); break;
    case 'merge': { const sg = stagesNow().stages; let k = sg.findIndex((s,i) => i > 0 && s.join === 'none' && sg[i-1].join === 'plus'); S.step = k >= 0 ? k : sg.length - 1; refresh(); afterStage(); break; }
    case 'answer': showAnswer(); break;
    case 'help': { const sg = stagesNow(); if(sg){ S.step = Math.min(1, sg.stages.length - 1); refresh(); } break; }
    case 'pic': { const it = item(); if(!it) break; if(!it.c.e){ toast('Tiada gambar untuk kad ini.'); break; } S.pic = !S.pic; refresh(); break; }
    case 'ex': S.ex = !S.ex; refresh(); break;
    case 'speak': speakStage(); break;
    case 'fav': { const it = item(); if(!it) break; if(DB.favs[it.c.id]){ delete DB.favs[it.c.id]; toast('Dibuang daripada Kegemaran.'); } else { DB.favs[it.c.id] = true; toast('Ditambah ke Kegemaran.'); } persist(); updateControls(); break; }
    case 'hide': S.hideWord = !S.hideWord; $('#hideBtn').classList.toggle('on', S.hideWord); refresh(); toast(S.hideWord ? 'Perkataan penuh disembunyikan pada permulaan kad.' : 'Perkataan penuh dipaparkan.'); break;
    case 'list': openList(); break;
    case 'edit': requireAdmin(() => openEditor(S.modId)); break;
    case 'editHome': requireAdmin(() => openEditor()); break;
    case 'settings': requireAdmin(openSettings); break;
    case 'backup': requireAdmin(openBackup); break;
    case 'help': openHelp(); break;
    case 'teach': enterTeach(); break;
    case 'exitTeach': exitTeach(); break;
    case 'fullscreen': toggleFS(); break;
    case 'ptr': togglePtr(); break;
    case 'rekod': openRekod(); break;
    case 'setpin': requireAdmin(openSetPin); break;
    case 'rmpin': requireAdmin(removePin); break;
    case 'lockadm': lockNow(); break;
    case 'jadual': openJadual(); break;
    case 'right': mark(true); break;
    case 'again': mark(false); break;
    case 'autoToggle': autoToggle(); break;
    case 'autoStop': autoStopBtn(); break;
    case 'autoStep': DB.settings.autoStep = !DB.settings.autoStep; persist(); b.classList.toggle('on', DB.settings.autoStep); toast(DB.settings.autoStep ? 'Setiap sela masa membuka satu langkah.' : 'Setiap sela masa menukar kad.'); break;
    case 'sec': DB.settings.autoSec = +b.dataset.v; persist(); $$('.autobar .tm button').forEach(x => x.classList.toggle('on', x === b)); if(S.auto.running) startAutoTimer(); break;
    case 'testVoice': Speech.say(['ba', 'ju', 'baju'], .7); if(!Speech.available()) {} break;
    case 'resetAll': confirmBox('Padam semua suntingan, kegemaran dan tetapan pada peranti ini?', 'Set semula', () => { DB.settings = Object.assign({}, DEFAULT_SETTINGS); DB.overrides = {}; DB.off = {}; DB.favs = {}; DB.last = null; persist(); $$('.ovl').forEach(o => o.remove()); renderHome(); toast('Semua data disetkan semula.'); }); break;
    case 'redoAgain': { const t = S.test; S.deck = t.again.slice(); S.idx = 0; S.test = {right:0, again:[], done:{}, total:0, finished:false}; resetCardState(); $('#sumOvl').remove(); renderPlayer(); break; }
    case 'redoAll': S.test = {right:0, again:[], done:{}, total:0, finished:false}; buildDeck(); $('#sumOvl').remove(); renderPlayer(); break;
    case 'closeSum': $('#sumOvl').remove(); break;
  }
  if(b.matches('.btn') && a !== 'sec') b.blur();
});

document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') { if(e.key === 'Escape') closeTop(); return; }
  if(e.key === 'Escape'){ if(closeTop()) return; if(S.teach){ exitTeach(); } return; }
  if($('.ovl')) return;
  if(S.view !== 'player') return;
  const k = e.key;
  if(k === ' ' || k === 'Spacebar'){ e.preventDefault(); stepFwd(); }
  else if(k === 'ArrowRight' || k === 'PageDown'){ e.preventDefault(); go(1); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); go(-1); }
  else if(k === 'ArrowDown'){ e.preventDefault(); stepFwd(); }
  else if(k === 'ArrowUp'){ e.preventDefault(); stepBack(); }
  else if(k === 'g' || k === 'G'){ const mb = $('[data-act="merge"]'); if(mb && !mb.disabled) mb.click(); else showAnswer(); }
  else if(k === 's' || k === 'S') speakStage();
  else if(k === 'r' || k === 'R'){ S.step = 0; S.ex = false; S.pic = false; refresh(); }
  else if(k === 'p' || k === 'P'){ const pb = $('[data-act="pic"]'); if(pb) pb.click(); }
  else if(k === 'c' || k === 'C') togglePtr();
  else if(k === 'j' || k === 'J'){ if(curGroupGrid()) openJadual(); }
  else if(k === 'f' || k === 'F') toggleFS();
  else if(k === 't' || k === 'T'){ S.teach ? exitTeach() : enterTeach(); }
});
document.addEventListener('keyup', e => { if((e.key === ' ' || e.key === 'Spacebar') && S.view === 'player' && !$('.ovl')) e.preventDefault(); });

/* ---------- Mula ---------- */
renderHome();
if(Cloud.enabled()) Cloud.load();

</script>
</body>
